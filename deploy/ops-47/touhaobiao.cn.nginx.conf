# 投好标 Nginx 示例（touhaobiao.cn → 47.109.141.16）
# 使用前：申请/上传 TLS 证书，替换证书路径；确认 DNS A 记录已指向 47.109.141.16。
# 后端只监听 127.0.0.1:3000，不直接暴露到公网。

server {
    listen 80;
    listen [::]:80;
    server_name touhaobiao.cn www.touhaobiao.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name touhaobiao.cn www.touhaobiao.cn;

    # TODO 运维替换为真实证书路径（Let's Encrypt 或企业证书）
    ssl_certificate     /etc/letsencrypt/live/touhaobiao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touhaobiao.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:touhaobiao_ssl:10m;

    root /opt/touhaobiao/client/dist;
    index index.html;

    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # SSE：任务进度必须关闭缓冲
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
