name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 单测全部使用桩对象、不连数据库；这里只是给 Prisma Client 生成用的占位值
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      SMS_PROVIDER: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: server
        run: pnpm exec prisma generate

      # 服务端 tsc 仍有 55 个历史基线错误（主要来自 docx/agent 的类型定义）。
      # 用「棘轮」：只禁止新增；清理后请同步调低基线，降到 0 后改为硬门禁。
      - name: Typecheck server (no new errors over baseline)
        working-directory: server
        run: |
          set +e
          OUT=$(pnpm exec tsc --noEmit -p tsconfig.json 2>&1)
          echo "$OUT"
          COUNT=$(printf '%s\n' "$OUT" | grep -c "error TS")
          echo "server type errors: ${COUNT} (baseline 55)"
          if [ "$COUNT" -gt 55 ]; then
            echo "::error::服务端类型错误由 55 增加到 ${COUNT}，请修复新增错误"
            exit 1
          fi
          exit 0

      - name: Typecheck client (must be 0)
        working-directory: client
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build client
        working-directory: client
        run: pnpm run build

      - name: Server unit tests
        working-directory: server
        run: |
          FILES=$(find src -name '*.test.ts' | sort)
          echo "test files: $(printf '%s\n' "$FILES" | wc -l)"
          pnpm exec tsx --test $FILES

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: thb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d thb_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/thb_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      SMS_PROVIDER: mock
      # 浏览器在 5173，API 直连 3000（客户端 .env 在 CI 不存在，这里显式注入）
      VITE_API_BASE_URL: http://127.0.0.1:3000/api
      E2E_API_BASE: http://127.0.0.1:3000/api
      # 图形验证码已改为 PNG 位图；该开关仅非生产生效，让 E2E 拿到答案而不必 OCR
      E2E_CAPTCHA_BYPASS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            client/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          (cd server && pnpm install --frozen-lockfile)
          (cd client && pnpm install --frozen-lockfile)
          (cd e2e && pnpm install --frozen-lockfile)

      - name: Prepare database
        working-directory: server
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: |
          (cd server && pnpm run start > /tmp/server.log 2>&1 &)
          (cd client && pnpm run dev > /tmp/client.log 2>&1 &)

          echo "waiting for API..."
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/system-settings >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/system-settings >/dev/null || { echo "server failed"; cat /tmp/server.log; exit 1; }

          echo "waiting for web..."
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/ >/dev/null || { echo "client failed"; cat /tmp/client.log; exit 1; }

          cd e2e && pnpm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
